name: Update the catalog

# When a release <id>-v<version> is published with the set zip attached, index.json is updated (size, sha256, url) and committed to main.
# When the release is deleted, that set leaves the catalog. Runs on this repository's own releases only.
on:
  release:
    types: [published, deleted]
  workflow_dispatch:          # by hand (Actions tab -> Run workflow): for a release whose zip was attached after publishing
    inputs:
      tag:
        description: "Release tag, e.g. amanda-v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the zip of the release
        if: github.event.action != 'deleted'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$TAG" --pattern '*.zip' --dir dl --repo "$GITHUB_REPOSITORY"

      - name: Update index.json
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ "$ACTION" = "deleted" ]; then
            python3 tools/update_index.py --remove --tag "$TAG"
          else
            n=$(ls dl/*.zip | wc -l)
            [ "$n" = "1" ] || { echo "ERROR: the release must have exactly one .zip attached (found $n)"; exit 1; }
            python3 tools/update_index.py --zip dl/*.zip --tag "$TAG" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Commit index.json
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if git diff --quiet index.json; then echo "index.json unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Catalog: $TAG"
          git push origin HEAD:main
